name: build-roothide-deb

# roothide 专用云编译：macOS runner + roothide/theos（THEOS_PACKAGE_SCHEME=roothide）
# 产物：iphoneos-arm64e 的 .deb（已内含 engine.js + postinst/prerm），可直接用 Sileo/Filza 安装

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 打印工具链
        run: |
          xcodebuild -version
          clang --version | head -2

      - name: 安装 roothide 版 Theos
        run: |
          set -eux
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          echo "--- vendor 内容 ---"
          ls "$THEOS/vendor"
          test -d "$THEOS/vendor/mod/roothide" || (echo "!! 不是 roothide 版 theos" && exit 1)
          test -f "$THEOS/vendor/include/roothide.h" || echo "!! roothide.h 没拉到（不 link roothide 库时无所谓）"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: 安装签名与打包工具
        run: |
          set -eux
          brew install ldid dpkg
          ldid -v || true
          dpkg-deb --version | head -3

      - name: 补 iOS 16.5 SDK（与上游一致，避开 Xcode 新 SDK 的差异）
        run: |
          set -eux
          mkdir -p "$THEOS/sdks"
          curl -L --retry 3 -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/" 2>/dev/null || \
            (echo "!! 16.5 SDK 没拿到，退回 Xcode SDK" && ls /tmp/sdks-master | head)
          ls "$THEOS/sdks" || true

      - name: 版本号随构建递增
        run: |
          set -eux
          VER="2.0.${GITHUB_RUN_NUMBER}"
          /usr/bin/sed -i '' -E "s/^Version: .*/Version: ${VER}/" ios/tweak/control
          grep '^Version:' ios/tweak/control

      - name: 打包引擎脚本 engine.js
        run: |
          set -eux
          # Contents API 上传的文件默认 644，这里补可执行位
          chmod +x ios/tweak/layout/usr/bin/jjcheat-fix
          chmod +x ios/tweak/layout/DEBIAN/postinst ios/tweak/layout/DEBIAN/prerm
          node tools/bundle.js
          mkdir -p "ios/tweak/layout/Library/Application Support/JJCheat"
          cp dist/engine.js "ios/tweak/layout/Library/Application Support/JJCheat/engine.js"
          # 同步生成内嵌副本：方案 B 的兜底（编进 dylib，文件全读不到也能起引擎）
          python3 tools/gen-engine-c.py dist/engine.js ios/tweak/JJEngineScript.c ios/tweak/JJEngineScript.h
          ls -l dist/engine.js "ios/tweak/layout/Library/Application Support/JJCheat/engine.js" ios/tweak/JJEngineScript.c

      - name: 编译 deb（roothide 方案）
        run: |
          set -eux
          # dpkg-deb 包装器：强制包内文件属主为 root:root（macOS 上没有 fakeroot）
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec %s --root-owner-group "$@"\n' "$(command -v dpkg-deb)" > "$RUNNER_TEMP/bin/dpkg-deb-root"
          chmod +x "$RUNNER_TEMP/bin/dpkg-deb-root"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          cd ios/tweak
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0 \
            THEOS_PACKAGE_SCHEME=roothide \
            DISABLE_ROOTLESS_COMPAT_WARNING=1 \
            _THEOS_PLATFORM_DPKG_DEB=dpkg-deb-root \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz

      - name: 校验产物
        run: |
          set -eux
          cd ios/tweak
          DEB=$(ls packages/*.deb | head -1)
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          echo "--- control 字段 ---"
          dpkg-deb -f "$DEB"
          echo "--- control 归档（必须含 postinst / prerm）---"
          dpkg-deb -I "$DEB"
          echo "--- 包内文件 ---"
          dpkg-deb -c "$DEB"
          echo "--- 解包检查 ---"
          rm -rf /tmp/unpack && mkdir -p /tmp/unpack
          dpkg-deb -x "$DEB" /tmp/unpack
          test -f "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.dylib"
          test -f "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.plist"
          test -f "/tmp/unpack/Library/Application Support/JJCheat/engine.js"
          test -x /tmp/unpack/usr/bin/jjcheat-fix
          # 源码 plist 是 XML，FINALPACKAGE 打包后可能转成 binary plist；
          # plutil -p 两种格式都能解析，比直接 grep 二进制稳。
          plutil -p "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.plist" | grep -q "cn.jj.chinachess"
          echo "--- install_name（roothide 应为 @loader_path/.jbroot/...）---"
          otool -D "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.dylib"
          echo "--- 依赖（必须含 libroothide，否则 jbroot() 运行时解析不了）---"
          otool -L "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.dylib" | tee /tmp/deps.txt
          grep -q "libroothide.dylib" /tmp/deps.txt || (echo "!! libroothide 没链上" && exit 1)
          echo "--- 架构 ---"
          lipo -info "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.dylib"
          echo "--- dylib 内嵌 engine.js（方案 B 兜底）---"
          nm -gU "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.dylib" \
            | grep -q "_JJEngineScript" || (echo "!! 内嵌 engine.js 没链进去" && exit 1)
          nm -gU "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.dylib" \
            | grep -E "_JJEngineScript" | head -4
          echo "--- 签名 ---"
          ldid -e "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.dylib" || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: JJCheat-roothide-deb
          path: ios/tweak/packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: 上传 engine.js（方便手动替换）
        uses: actions/upload-artifact@v4
        with:
          name: JJCheat-engine-js
          path: dist/engine.js
          if-no-files-found: error
