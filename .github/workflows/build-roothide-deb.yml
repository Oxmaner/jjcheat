name: build-roothide-deb

# roothide 专用云编译：macOS runner + roothide/theos（THEOS_PACKAGE_SCHEME=roothide）
# 2.1.0 起多一步：先把 Pikafish 交叉编译成 iOS arm64 可执行文件塞进 layout，
# 再打 deb。产物 iphoneos-arm64e，内含 engine.js（识别）+ pikafish（棋力）。

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PIKA_TAG: Pikafish-2026-09-06

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 打印工具链
        run: |
          xcodebuild -version
          clang --version | head -2
          xcrun --sdk iphoneos --show-sdk-path

      - name: 安装 roothide 版 Theos
        run: |
          set -eux
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          echo "--- vendor 内容 ---"
          ls "$THEOS/vendor"
          test -d "$THEOS/vendor/mod/roothide" || (echo "!! 不是 roothide 版 theos" && exit 1)
          test -f "$THEOS/vendor/include/roothide.h" || echo "!! roothide.h 没拉到（不 link roothide 库时无所谓）"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: 安装签名与打包工具
        run: |
          set -eux
          brew install ldid dpkg
          ldid -v || true
          dpkg-deb --version | head -3

      - name: 补 iOS 16.5 SDK（与上游一致，避开 Xcode 新 SDK 的差异）
        run: |
          set -eux
          mkdir -p "$THEOS/sdks"
          curl -L --retry 3 -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/" 2>/dev/null || \
            (echo "!! 16.5 SDK 没拿到，退回 Xcode SDK" && ls /tmp/sdks-master | head)
          ls "$THEOS/sdks" || true

      # 引擎体积 30~60MB、LTO 要十几分钟，只改 UI 时不该重编
      - name: 缓存 Pikafish 源码与产物
        uses: actions/cache@v4
        with:
          path: engine/.build
          key: pikafish-${{ env.PIKA_TAG }}-${{ hashFiles('engine/build-ios.sh') }}
          restore-keys: |
            pikafish-${{ env.PIKA_TAG }}-

      - name: 交叉编译 Pikafish（iOS arm64）
        run: |
          set -eux
          chmod +x engine/build-ios.sh
          PIKA_TAG="$PIKA_TAG" bash engine/build-ios.sh

      - name: 版本号随构建递增
        run: |
          set -eux
          VER="2.1.${GITHUB_RUN_NUMBER}"
          /usr/bin/sed -i '' -E "s/^Version: .*/Version: ${VER}/" ios/tweak/control
          grep '^Version:' ios/tweak/control

      - name: 打包引擎脚本 engine.js
        run: |
          set -eux
          # Contents API 上传的文件默认 644，这里补可执行位
          chmod +x ios/tweak/layout/DEBIAN/postinst ios/tweak/layout/DEBIAN/prerm
          node tools/bundle.js
          echo "--- 回归测试（13 场景全绿才出包）---"
          node tools/regression.js
          mkdir -p "ios/tweak/layout/Library/Application Support/JJCheat"
          cp dist/engine.js "ios/tweak/layout/Library/Application Support/JJCheat/engine.js"
          # 同步生成内嵌副本：文件全读不到也能起识别（roothide 下 jbroot 路径随机）
          python3 tools/gen-engine-c.py dist/engine.js ios/tweak/Vision/JJEngineScript.c ios/tweak/Vision/JJEngineScript.h
          ls -l dist/engine.js "ios/tweak/layout/Library/Application Support/JJCheat/engine.js" ios/tweak/Vision/JJEngineScript.c
          grep -c pikafishNative dist/engine.js

      - name: 编译 deb（roothide 方案）
        run: |
          set -eux
          # dpkg-deb 包装器：强制包内文件属主为 root:root（macOS 上没有 fakeroot）
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec %s --root-owner-group "$@"\n' "$(command -v dpkg-deb)" > "$RUNNER_TEMP/bin/dpkg-deb-root"
          chmod +x "$RUNNER_TEMP/bin/dpkg-deb-root"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          cd ios/tweak
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0 \
            THEOS_PACKAGE_SCHEME=roothide \
            DISABLE_ROOTLESS_COMPAT_WARNING=1 \
            _THEOS_PLATFORM_DPKG_DEB=dpkg-deb-root \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz

      - name: 校验产物
        run: |
          set -eux
          cd ios/tweak
          DEB=$(ls packages/*.deb | head -1)
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          echo "--- control 字段 ---"
          dpkg-deb -f "$DEB"
          echo "--- control 归档（必须含 postinst / prerm）---"
          dpkg-deb -I "$DEB"
          echo "--- 包内文件 ---"
          dpkg-deb -c "$DEB"
          echo "--- 解包检查 ---"
          rm -rf /tmp/unpack && mkdir -p /tmp/unpack
          dpkg-deb -x "$DEB" /tmp/unpack
          DYLIB="/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.dylib"
          PIKA="/tmp/unpack/Library/Application Support/JJCheat/Pikafish/pikafish"
          NET="/tmp/unpack/Library/Application Support/JJCheat/Pikafish/pikafish.nnue"
          test -f "$DYLIB"
          test -f "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.plist"
          test -f "/tmp/unpack/Library/Application Support/JJCheat/engine.js"
          test -x "$PIKA" || (echo "!! 包里没有可执行的 pikafish" && exit 1)
          echo "--- pikafish ---"
          ls -l "$PIKA"
          file -b "$PIKA"
          case "$(file -b "$PIKA")" in
            *Mach-O*arm64*) ;;
            *) echo "!! pikafish 不是 arm64 Mach-O"; exit 1 ;;
          esac
          SIZE=$(wc -c < "$PIKA" | tr -d ' ')
          echo "pikafish = $SIZE 字节"
          codesign -dv "$PIKA" 2>&1 | head -3 || true
          # 2026 版 Pikafish 不内嵌 NNUE，权重必须独立随包（~48MB）
          test -f "$NET" || (echo "!! 包里没有 pikafish.nnue，引擎启动即退出" && exit 1)
          NETSIZE=$(wc -c < "$NET" | tr -d ' ')
          test "$NETSIZE" -gt 20000000 || (echo "!! pikafish.nnue 只有 $NETSIZE 字节"; exit 1)
          echo "pikafish.nnue = $NETSIZE 字节"
          # 源码 plist 是 XML，FINALPACKAGE 打包后可能转成 binary plist；
          # plutil -p 两种格式都能解析，比直接 grep 二进制稳。
          plutil -p "/tmp/unpack/Library/MobileSubstrate/DynamicLibraries/JJCheat.plist" | grep -q "cn.jj.chinachess"
          echo "--- install_name（roothide 应为 @loader_path/.jbroot/...）---"
          otool -D "$DYLIB"
          echo "--- 依赖（必须含 libroothide，否则 jbroot() 运行时解析不了）---"
          otool -L "$DYLIB" | tee /tmp/deps.txt
          grep -q "libroothide.dylib" /tmp/deps.txt || (echo "!! libroothide 没链上" && exit 1)
          echo "--- 架构 ---"
          lipo -info "$DYLIB"
          echo "--- dylib 内嵌 engine.js（兜底副本）---"
          nm -gU "$DYLIB" | grep -q "_JJEngineScript" || (echo "!! 内嵌 engine.js 没链进去" && exit 1)
          echo "--- 2.1.0 新增符号（引擎类 + 编解码 C 函数必须都在）---"
          # JJMoveCodec 是纯 C 函数模块（无 @interface），所以查 _JJMoveChinese，
          # 别写成 _OBJC_CLASS_$_JJMoveCodec —— 那个符号本来就不存在
          for sym in _OBJC_CLASS_\$_JJPikafish _OBJC_CLASS_\$_JJPikafishInstaller \
                     _OBJC_CLASS_\$_JJGameController _OBJC_CLASS_\$_JJCalibrator \
                     _OBJC_CLASS_\$_JJBallWindow _OBJC_CLASS_\$_JJHUDWindow \
                     _JJMoveChinese _JJSqFromICCS; do
            nm -gU "$DYLIB" | grep -q "$sym" || (echo "!! 缺符号 $sym"; exit 1)
          done
          echo "符号齐全"
          echo "--- 签名 ---"
          ldid -e "$DYLIB" || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: JJCheat-roothide-deb
          path: ios/tweak/packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: 上传 engine.js（方便手动替换）
        uses: actions/upload-artifact@v4
        with:
          name: JJCheat-engine-js
          path: dist/engine.js
          if-no-files-found: error

      - name: 上传 Pikafish 产物（排查用）
        uses: actions/upload-artifact@v4
        with:
          name: JJCheat-pikafish
          path: engine/.build/src/src/pikafish
          if-no-files-found: warn
          retention-days: 7
